<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>figCurves</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<script src="explore_viz/curves_data.js"></script>
<style>
html,body{margin:0;padding:0;background:transparent;font-family:'Google Sans','Noto Sans',sans-serif;}
#plot{width:100%;height:440px;}
#wrap{position:relative;}
.ttl{position:absolute;top:8px;transform:translateX(-50%);white-space:nowrap;z-index:20;
     font-size:17.5px;font-weight:700;color:#2b2b2b;cursor:default;}
.ttl>span{border-bottom:2px dotted #a8a4b2;padding-bottom:1px;}
.ttl .vbub{position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%) scale(.97);
     opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;
     background:#fff;border:1px solid #ddd;border-radius:12px;
     box-shadow:0 10px 30px rgba(20,20,40,.20);padding:6px;width:280px;z-index:40;}
.ttl:hover .vbub, .ttl.force .vbub{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1);}
.vbub video{width:100%;border-radius:8px;display:block;background:#000;}
.vbub .cap{font-size:11.5px;font-weight:400;color:#737373;text-align:center;padding:4px 2px 1px;white-space:normal;}
</style>
</head>
<body>
<div id="wrap">
<div id="plot"></div>
<div class="ttl" id="ttl0"><span>Tactile Cube Pick</span>
  <div class="vbub"><video muted loop playsinline preload="none" src="explore_viz/cmp_tact_asteroid_0.mp4"></video>
  <div class="cap">tactile-only cube pick — ASTEROID rollout</div></div></div>
<div class="ttl" id="ttl1"><span>Wrist Peg Insertion</span>
  <div class="vbub"><video muted loop playsinline preload="none" src="explore_viz/cmp_peg_asteroid_0.mp4"></video>
  <div class="cap">wrist-camera peg insertion — ASTEROID rollout</div></div></div>
</div>
<script>
(function(){
  var D = window.CURVES_DATA;
  var FONT = "'Google Sans','Noto Sans',sans-serif";
  var N_MARK = 8;
  var DIM = 0.12;

  function hexA(hex, a){
    var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }
  function logSpace(a, b, n){
    var out=[], la=Math.log10(a), lb=Math.log10(b);
    for (var i=0;i<n;i++) out.push(Math.pow(10, la + (lb-la)*i/(n-1)));
    return out;
  }

  var traces = [];
  D.tasks.forEach(function(task, ti){
    var ax = ti===0 ? '' : (ti+1);
    var xa = 'x'+ax, ya = 'y'+ax;
    function add(t){ t.xaxis=xa; t.yaxis=ya; traces.push(t); }
    var lo = task.xlim[0], hi = task.xlim[1];
    function markXFor(m){
      var phase = (D.order.indexOf(m) % 3 - 1) * 0.09;
      return logSpace(lo*Math.pow(10,0.12+phase), hi*Math.pow(10,-0.12+phase), N_MARK);
    }

    // stderr bands first (lowest z), tagged with their method's legendgroup so they dim together
    D.order.slice().reverse().forEach(function(m){
      var md = task.methods[m];
      if (!md) return;
      var c = D.colors[m];
      var bx = md.type==='flat' ? [lo,hi] : md.x;
      var blo = md.type==='flat' ? [md.mean-md.stderr,md.mean-md.stderr] : md.mean.map(function(v,i){ return v-md.stderr[i]; });
      var bhi = md.type==='flat' ? [md.mean+md.stderr,md.mean+md.stderr] : md.mean.map(function(v,i){ return v+md.stderr[i]; });
      add({x:bx, y:blo, mode:'lines', line:{width:0}, hoverinfo:'skip', showlegend:false, legendgroup:m});
      add({x:bx, y:bhi, mode:'lines', line:{width:0}, fill:'tonexty', fillcolor:hexA(c,0.14),
           hoverinfo:'skip', showlegend:false, legendgroup:m});
    });

    add({x:[lo,hi], y:[task.expert,task.expert], mode:'lines', name:'Expert',
         line:{color:D.colors.expert, dash:'dash', width:1.6},
         legendgroup:'Expert', showlegend: ti===0,
         hovertemplate:'%{y:.0%}<extra>Expert</extra>'});

    D.order.forEach(function(m){
      var md = task.methods[m];
      if (!md) return;
      var c = D.colors[m], sym = D.markers[m], label = (D.labels||{})[m] || m;
      if (md.type === 'flat') {
        add({x:[lo,hi], y:[md.mean,md.mean], mode:'lines', name:label,
             line:{color:hexA(c,0.6), dash:'dot', width:2},
             legendgroup:m, showlegend:false,
             hovertemplate:'%{y:.0%}<extra>'+label+'</extra>'});
        var markX = markXFor(m);
        add({x:markX, y:markX.map(function(){ return md.mean; }), mode:'markers', name:label,
             marker:{symbol:sym, size:7, color:c, opacity:0.75, line:{color:'#fff', width:1}},
             legendgroup:m, showlegend: ti===0,
             hovertemplate:'%{y:.0%}<extra>'+label+'</extra>'});
      } else {
        var isOurs = (m === 'Ours');
        add({x:md.x, y:md.mean, mode:'lines', name:label,
             line:{color:c, width:isOurs?3:2}, legendgroup:m, showlegend:false,
             hovertemplate:'%{y:.0%}<extra>'+label+'</extra>'});
        var mx, my;
        if (isOurs || md.x.length <= N_MARK) { mx = md.x; my = md.mean; }
        else {
          mx = []; my = [];
          for (var k=0;k<N_MARK;k++){
            var idx = Math.round(k*(md.x.length-1)/(N_MARK-1));
            mx.push(md.x[idx]); my.push(md.mean[idx]);
          }
        }
        add({x:mx, y:my, mode:'markers', name:label,
             marker:{symbol:sym, size:isOurs?10:8, color:c, line:{color:'#fff', width:1.2}},
             legendgroup:m, showlegend: ti===0,
             hovertemplate:'%{y:.0%}<extra>'+label+'</extra>'});
      }
    });
  });

  function logAxis(task){
    return { type:'log', range:[Math.log10(task.xlim[0]), Math.log10(task.xlim[1])],
             title:{text:'environment steps', font:{size:16, color:'#55525e'}},
             tickfont:{size:14, color:'#737373'}, gridcolor:'#e9e9e9',
             tickvals:[1e5,1e6,1e7,1e8], ticktext:['100k','1M','10M','100M'],
             minor:{showgrid:true, gridcolor:'#f6f6f6', dtick:'D1'},
             zeroline:false, linecolor:'#c9c9c9', mirror:true };
  }
  function yAxis(first){
    return { range:[-0.05,1.05],
             title: first ? {text:'success rate', font:{size:16, color:'#55525e'}} : undefined,
             tickformat:'.0%', tickfont:{size:14, color:'#737373'},
             showticklabels: first, gridcolor:'#e9e9e9', zeroline:false,
             linecolor:'#c9c9c9', mirror:true };
  }
  var layout = {
    font:{family:FONT}, paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'#fff',
    margin:{l:64,r:22,t:44,b:96},
    hovermode:'closest',
    hoverlabel:{font:{family:FONT, size:14}, bgcolor:'#fff', bordercolor:'#c9c9c9'},
    xaxis:  Object.assign(logAxis(D.tasks[0]), {domain:[0, 0.465]}),
    xaxis2: Object.assign(logAxis(D.tasks[1]), {domain:[0.535, 1]}),
    yaxis:  Object.assign(yAxis(true),  {domain:[0,1]}),
    yaxis2: Object.assign(yAxis(false), {domain:[0,1], anchor:'x2'}),
    annotations: [],
    legend:{ orientation:'h', x:0.5, xanchor:'center', y:-0.26,
             font:{size:14.5, color:'#454250'}, bgcolor:'rgba(255,255,255,0.9)',
             bordercolor:'#dddddd', borderwidth:1 }
  };

  var gd = document.getElementById('plot');
  Plotly.newPlot(gd, traces, layout, {displayModeBar:false, responsive:true}).then(function(){
    // spotlight: hovering any trace (curves, baselines, markers) dims every other method
    var restoreTimer = null;
    var baseFills = gd.data.map(function(t){ return t.fillcolor || null; });
    function fade(rgba, f){
      return rgba.replace(/rgba\(([^)]+),([^,)]+)\)/, function(_, rgb, a){
        return 'rgba(' + rgb + ',' + (parseFloat(a) * f) + ')';
      });
    }
    function setDim(group){
      var ops = [], fills = [];
      gd.data.forEach(function(t, i){
        var on = (group === null || t.legendgroup === group);
        ops.push(on ? 1 : DIM);
        fills.push(baseFills[i] ? (on ? baseFills[i] : fade(baseFills[i], DIM)) : null);
      });
      Plotly.restyle(gd, {opacity: ops, fillcolor: fills});
    }
    gd.on('plotly_hover', function(ev){
      if (restoreTimer) { clearTimeout(restoreTimer); restoreTimer = null; }
      var t = gd.data[ev.points[0].curveNumber];
      if (t && t.legendgroup) setDim(t.legendgroup);
    });
    gd.on('plotly_unhover', function(){
      restoreTimer = setTimeout(function(){ setDim(null); }, 120);
    });
    placeTitles();
  });
  // task titles sit over each panel's domain center; hovering shows a task-video bubble
  var DOMS = [[0,0.465],[0.535,1]];
  function placeTitles(){
    var sz = gd._fullLayout && gd._fullLayout._size;
    if (!sz) return;
    DOMS.forEach(function(dom, i){
      var el = document.getElementById('ttl'+i);
      el.style.left = (sz.l + sz.w*(dom[0]+dom[1])/2) + 'px';
    });
  }
  window.addEventListener('resize', function(){ setTimeout(placeTitles, 60); });
  document.querySelectorAll('.ttl').forEach(function(el){
    var v = el.querySelector('video');
    el.addEventListener('mouseenter', function(){ v.play().catch(function(){}); });
    el.addEventListener('mouseleave', function(){ v.pause(); });
  });

  function reportH(){
    try { window.parent.postMessage({ type:'lmp-figheight', height: document.body.scrollHeight }, '*'); } catch(e){}
  }
  window.addEventListener('load', function(){ reportH(); setTimeout(reportH, 400); });
  window.addEventListener('resize', reportH);
}());
</script>
<script>setTimeout(function(){document.getElementById('ttl0').classList.add('force');},1200);</script></body>
</html>
