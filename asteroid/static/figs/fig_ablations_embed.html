<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>figAblations</title>
<script src="https://cdn.plot.ly/plotly-basic-2.35.2.min.js" charset="utf-8"></script>
<style>
html,body{margin:0;padding:0;background:transparent;font-family:'Google Sans','Noto Sans',sans-serif;}
#tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:2px 0 10px;}
.tab{border:1.5px solid #d5d2dd;background:#fff;color:#454250;border-radius:999px;
     padding:7px 16px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
     transition:all .18s ease;}
.tab:hover{border-color:#003366;color:#003366;}
.tab.active{background:#003366;border-color:#003366;color:#fff;}
#blurb{max-width:760px;margin:0 auto 6px;text-align:center;font-size:14.5px;color:#55525e;
       line-height:1.45;min-height:2.9em;}
#plot{width:65%;margin:0 auto;height:380px;}
</style>
</head>
<body>
<div id="tabs"></div>
<div id="blurb"></div>
<div id="plot"></div>
<script>
(function(){
  var FONT="'Google Sans','Noto Sans',sans-serif", NAVY='#003366', DIM=0.12, X=[0,1,2];
  function hexA(h,a){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a+')';}
  var SQ3=Math.sqrt(3);
  // Baseline pinned by tactile_ablation.py (matches the paper's ablation figure)
  var BASE={mean:[0.4427,0.7448,0.8223], stderr:[0.08/SQ3,0.036084/SQ3,0.019042/SQ3]};
  var BC={mean:0.5625, stderr:0.095043/SQ3};
  // wandb eval-group aggregates (2 seeds), exp_names in src/explore_viz/dump_ablations.py
  var SCHED={
    'Schedule-1':{mean:[0.4844,0.8047,0.9453], stderr:[0.011,0.0166,0.0166], c:'#2ca02c', sym:'triangle-down'},
    'Schedule-2':{mean:[0.5391,0.8125,0.8906], stderr:[0.0276,0.0442,0.0221], c:'#ff7f0e', sym:'triangle-up'},
    'Schedule-3':{mean:[0.4922,0.8828,0.9062], stderr:[0.0497,0.0276,0.0221], c:'#9467bd', sym:'square'}};
  var NOISY={mean:[0.5156,0.7969,0.8438], stderr:[0.0221,0.0221,0.0331], c:'#8c564b', sym:'diamond'};
  var POMDP={mean:[0.48,0.785,0.815], stderr:[0.0141,0.0035,0.0177]};

  function band(x,mean,se,color,group){
    var lo=mean.map(function(v,i){return v-se[i];}), hi=mean.map(function(v,i){return v+se[i];});
    return [
      {x:x,y:lo,mode:'lines',line:{width:0},hoverinfo:'skip',showlegend:false,legendgroup:group},
      {x:x,y:hi,mode:'lines',line:{width:0},fill:'tonexty',fillcolor:hexA(color,0.15),
       hoverinfo:'skip',showlegend:false,legendgroup:group}];
  }
  function curve(x,d,name,color,sym,thick){
    return {x:x,y:d.mean,mode:'lines+markers',name:name,
      line:{color:color,width:thick?3:2.2},
      marker:{size:thick?10:8,symbol:sym||'circle',color:color,line:{color:'#fff',width:1.2}},
      legendgroup:name,hovertemplate:'%{y:.0%}<extra>'+name+'</extra>'};
  }
  function flat(v,se,name,color,dash){
    var t=[];
    if(se>0) t=t.concat(band([-0.2,2.2],[v,v],[se,se],color,name));
    t.push({x:[-0.2,2.2],y:[v,v],mode:'lines',name:name,
      line:{color:name==='Expert'?color:hexA(color,0.75),dash:dash,width:name==='Expert'?1.6:2},
      legendgroup:name,hovertemplate:Math.round(v*100)+'%<extra>'+name+'</extra>'});
    return t;
  }

  var TABS=[
    { key:'noisy', label:'Noisy Expert',
      blurb:'Does ASTEROID need a perfect expert? Adding noise to the privileged expert’s actions barely moves the curve — context-level supervision tolerates imperfect labels.',
      traces:function(){
        var t=flat(0.96,0,'Expert','#000000','dash').concat(flat(BC.mean,BC.stderr,'BC','#1f77b4','dot'));
        t=t.concat(band(X,BASE.mean,BASE.stderr,NAVY,'ASTEROID'), [curve(X,BASE,'ASTEROID',NAVY,'circle',true)]);
        t=t.concat(band(X,NOISY.mean,NOISY.stderr,NOISY.c,'Noisy Expert'),
                   [curve(X,NOISY,'Noisy Expert',NOISY.c,NOISY.sym)]);
        return t;
      }},
    { key:'sched', label:'Exploration Curriculum',
      blurb:'How sensitive is the exploration-horizon curriculum? Three alternative schedules all converge to the same performance — the recipe is robust to this choice.',
      traces:function(){
        var t=flat(0.96,0,'Expert','#000000','dash');
        t=t.concat(band(X,BASE.mean,BASE.stderr,NAVY,'ASTEROID'), [curve(X,BASE,'ASTEROID',NAVY,'circle',true)]);
        Object.keys(SCHED).forEach(function(k){
          var d=SCHED[k];
          t=t.concat(band(X,d.mean,d.stderr,d.c,k), [curve(X,d,k,d.c,d.sym)]);
        });
        return t;
      }},
    { key:'pomdp', label:'No Proprioception',
      blurb:'Extreme partial observability: tactile sensing only, no joint angles at all. ASTEROID still learns to explore from contact feedback alone and clears BC by a wide margin.',
      traces:function(){
        var t=flat(0.96,0,'Expert','#000000','dash')
          .concat(flat(0.48,0.028/Math.sqrt(2),'BC','#1f77b4','dot'));
        t=t.concat(band(X,POMDP.mean,POMDP.stderr,NAVY,'ASTEROID'), [curve(X,POMDP,'ASTEROID',NAVY,'circle',true)]);
        return t;
      }},
    { key:'aawr', label:'Offline Data Sensitivity',
      blurb:'AAWR needs an offline dataset whose coverage matches deployment: on peg insertion it swings from 47% to 0% with the dataset’s noise level. ASTEROID collects its own data on-policy.',
      bars:true,
      traces:function(){
        var cats=['ASTEROID','AAWR (std=5)','AAWR (Expert)','AAWR (std=10)'];
        var vals=[0.783,0.4667,0.283,0.0];
        var errs=[0.0764/SQ3,0.0289/SQ3,0.125/SQ3,0.0];
        var cols=[NAVY,'#6B3F2A','#A66A3F','#D9B38C'];
        return [
          {x:[-0.6,3.6],y:[0.9,0.9],mode:'lines',name:'Expert',line:{color:'#000',dash:'dash',width:1.6},
           legendgroup:'Expert',hovertemplate:'90%<extra>Expert</extra>'},
          {x:[0,1,2,3],y:vals,type:'bar',width:0.55,marker:{color:cols,line:{color:'#fff',width:1}},
           error_y:{type:'data',array:errs,color:'#55525e',thickness:1.2,width:5},
           name:'max success',showlegend:false,customdata:cats,
           hovertemplate:'%{y:.0%}<extra>%{customdata}</extra>'}];
      }}
  ];

  var tabsEl=document.getElementById('tabs'), blurbEl=document.getElementById('blurb'),
      gd=document.getElementById('plot'), active=0;

  TABS.forEach(function(tab,i){
    var b=document.createElement('button');
    b.className='tab'+(i===0?' active':''); b.textContent=tab.label;
    b.addEventListener('click',function(){ if(active!==i){ active=i; render(); } });
    tabsEl.appendChild(b);
  });

  function layoutFor(tab){
    var lay={
      font:{family:FONT}, paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'#fff',
      margin:{l:64,r:22,t:16,b:tab.bars?58:82}, hovermode:'closest',
      hoverlabel:{font:{family:FONT,size:14},bgcolor:'#fff',bordercolor:'#c9c9c9'},
      yaxis:{range:[-0.05,1.05],tickformat:'.0%',tickfont:{size:14,color:'#737373'},
             title:{text:'success rate',font:{size:16,color:'#55525e'}},
             gridcolor:'#e9e9e9',zeroline:false,linecolor:'#c9c9c9',mirror:true},
      showlegend:!tab.bars,
      legend:{orientation:'h',x:0.5,xanchor:'center',y:-0.3,
              font:{size:14,color:'#454250'},bgcolor:'rgba(255,255,255,0.9)',
              bordercolor:'#dddddd',borderwidth:1},
      bargap:0.3
    };
    if(tab.bars){
      lay.xaxis={tickvals:[0,1,2,3],ticktext:['ASTEROID','AAWR (std=5)','AAWR (Expert)','AAWR (std=10)'],
                 range:[-0.6,3.6],tickfont:{size:13.5,color:'#55525e'},linecolor:'#c9c9c9',mirror:true,showgrid:false};
    } else {
      lay.xaxis={tickvals:X,ticktext:['0','1','2'],range:[-0.2,2.2],
                 title:{text:'iteration',font:{size:16,color:'#55525e'}},
                 tickfont:{size:14,color:'#737373'},gridcolor:'#e9e9e9',zeroline:false,
                 linecolor:'#c9c9c9',mirror:true};
    }
    return lay;
  }

  function attachDim(){
    var restoreTimer=null;
    var baseFills=gd.data.map(function(t){return t.fillcolor||null;});
    function fade(rgba,f){
      return rgba.replace(/rgba\(([^)]+),([^,)]+)\)/,function(_,rgb,a){
        return 'rgba('+rgb+','+(parseFloat(a)*f)+')';});
    }
    function setDim(group){
      var ops=[],fills=[];
      gd.data.forEach(function(t,i){
        var on=(group===null||t.legendgroup===group||t.type==='bar');
        ops.push(on?1:DIM);
        fills.push(baseFills[i]?(on?baseFills[i]:fade(baseFills[i],DIM)):null);
      });
      Plotly.restyle(gd,{opacity:ops,fillcolor:fills});
    }
    gd.on('plotly_hover',function(ev){
      if(restoreTimer){clearTimeout(restoreTimer);restoreTimer=null;}
      var t=gd.data[ev.points[0].curveNumber];
      if(t&&t.legendgroup&&t.type!=='bar') setDim(t.legendgroup);
    });
    gd.on('plotly_unhover',function(){
      restoreTimer=setTimeout(function(){setDim(null);},120);
    });
  }

  function render(){
    Array.prototype.forEach.call(tabsEl.children,function(b,i){
      b.className='tab'+(i===active?' active':'');
    });
    var tab=TABS[active];
    blurbEl.textContent=tab.blurb;
    Plotly.react(gd, tab.traces(), layoutFor(tab), {displayModeBar:false,responsive:true})
      .then(function(){ attachDim(); reportH(); });
  }

  function reportH(){
    try{window.parent.postMessage({type:'lmp-figheight',height:document.body.scrollHeight},'*');}catch(e){}
  }
  window.addEventListener('load',function(){render(); setTimeout(reportH,400);});
  window.addEventListener('resize',reportH);
}());

window.addEventListener('load', function(){
  setTimeout(function(){ try{ Plotly.Plots.resize(document.getElementById('plot')); }catch(e){} }, 350);
});
</script>
</body>
</html>
