<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>figBC</title>
<style>
html,body{margin:0;padding:0;background:transparent;}
.fig{width:100%;height:auto;display:block;cursor:pointer;}
.fig text{font-family:'Google Sans','Noto Sans',sans-serif;}

.fig .anim{opacity:0;}
.fig.play .anim{animation:riseIn 1.0s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--d,0s);}
@keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* trajectory arcs: the CURRENT rollout draws solid navy with the agent riding its head, then hands
   off to a solid light-gray copy — light gray = history; repeat visits stack the same route
   thicker so the traveled route reads heavier */
.fig .arc{opacity:0;stroke:#1f3f7a;}
.fig.play .arc{animation:arcDraw .9375s linear both, arcFade .35s linear both;animation-delay:var(--d,0s),calc(var(--d,0s) + .85s);}
@keyframes arcDraw{
  0%{opacity:1;stroke-dashoffset:var(--len,260);}
  55%{opacity:1;stroke-dashoffset:0;}
  100%{opacity:1;stroke-dashoffset:0;}
}
@keyframes arcFade{from{opacity:1;}to{opacity:0;}}
.fig .arcPast{opacity:0;stroke:#e2deec;}
.fig.play .arcPast{animation:pastIn .35s linear both;animation-delay:calc(var(--d,0s) + .85s);}
@keyframes pastIn{from{opacity:0;}to{opacity:1;}}

/* reward-curve segments: paint over the light-gray ghost in navy and stay navy — the curve-so-far highlights the
   full trajectory up to the current episode */
.fig .draw{opacity:0;stroke:#e2deec;}
.fig.play .draw{animation:drawIn .9375s linear both;animation-delay:var(--d,0s);}
@keyframes drawIn{
  0%{opacity:0;stroke:#1f3f7a;stroke-dashoffset:var(--len,120);}
  16%{opacity:1;}
  50%{opacity:1;stroke:#1f3f7a;stroke-dashoffset:0;}
  100%{opacity:1;stroke:#1f3f7a;stroke-dashoffset:0;}
}

/* reward points: pop in navy on the current step and stay navy (gold hits stay gold) */
.fig .pulse{opacity:0;transform-box:fill-box;transform-origin:50% 50%;fill:#1f3f7a;}
.fig.play .pulse{animation:pulseIn .9375s cubic-bezier(.34,1.2,.64,1) both;animation-delay:var(--d,0s);}
@keyframes pulseIn{
  0%{opacity:0;transform:scale(.3);}
  26%{opacity:1;transform:scale(1.5);}
  50%{transform:scale(1);}
  100%{opacity:1;transform:scale(1);fill:#1f3f7a;}
}
.fig .pulse.hit{fill:#e3a730 !important;animation-name:pulseInHit;}
@keyframes pulseInHit{
  0%{opacity:0;transform:scale(.3);fill:#e3a730;}
  26%{opacity:1;transform:scale(1.5);fill:#e3a730;}
  50%{transform:scale(1);fill:#e3a730;}
  100%{opacity:1;transform:scale(1);fill:#e3a730;}
}

/* hover bubble: how BC is actually trained — three expert trajectories, distilled into a
   single pi. Drawn as an overlay within the SAME viewBox (no resize needed in the iframe). */
.fig .bubble{opacity:0;pointer-events:none;transition:opacity .28s ease;}
.fig:hover .bubble{opacity:1;pointer-events:auto;}
.fig .bubble .bline{opacity:0;}
.fig:hover .bubble .bline{animation:bIn .5s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--bd,0s);}
@keyframes bIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* per-row trajectory arcs: same grammar as the main panel — the current rollout draws solid
   navy, then settles to solid light gray (history) */
.fig .bubble .barc{opacity:0;stroke:#e2deec;}
.fig:hover .bubble .barc{animation:barcDraw .9375s linear both;animation-delay:var(--bd,0s);}
@keyframes barcDraw{
  0%{opacity:1;stroke:#1f3f7a;stroke-dashoffset:var(--len,200);}
  55%{opacity:1;stroke:#1f3f7a;stroke-dashoffset:0;}
  85%{stroke:#1f3f7a;}
  100%{opacity:1;stroke:#e2deec;stroke-dashoffset:0;}
}
/* the expert rides its rollout to the goal door — the agent moves, not only the line */
.fig .bubble .bagent{opacity:0;offset-rotate:0deg;}
@supports (offset-path: path("M0,0 L1,1")){
  .fig:hover .bubble .bagent{animation:bRide .52s linear both;animation-delay:var(--bd,0s);}
}
@supports not (offset-path: path("M0,0 L1,1")){
  .fig:hover .bubble .bagent{animation:bIn .5s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--bd,0s);}
}
@keyframes bRide{0%{opacity:0;offset-distance:0%;}4%{opacity:1;}100%{opacity:1;offset-distance:100%;}}

/* the agent: fades in once at rest, then loops through traveling out to each door and back */
.fig .agent{opacity:0;}
.fig.play .agent{animation:agentIn .625s ease-out both, agentMove 9.6875s linear both;}
@keyframes agentIn{from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>
<style>body.animoff svg *{animation-play-state:paused!important;}</style>
<script>
(function(){
  var si = window.setInterval;
  window.setInterval = function(fn, ms){
    return si(function(){ if (!document.body.classList.contains('animoff')) fn(); }, ms);
  };
  function apply(vis){ document.body.classList.toggle('animoff', !vis); }
  var inView = true;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(es){
      inView = es[0].isIntersecting; apply(inView && !document.hidden);
    }, {threshold: 0.05}).observe(document.documentElement);
  }
  document.addEventListener('visibilitychange', function(){ apply(inView && !document.hidden); });
}());
</script>

    <circle fill="#f5ead0" cx="11" cy="18" r="1.6"/>
    <path fill="#eebd52" d="M25 3c-.552 0-1 .448-1 1v9H11c-.552 0-1 .448-1 1s.448 1 1 1h14c.552 0 1-.448 1-1V4c0-.552-.448-1-1-1zm0 25c.552 0 1 .448 1 1v3c0 .552-.448 1-1 1H11c-.552 0-1-.448-1-1s.448-1 1-1h13v-2c0-.552.448-1 1-1z"/>
    <path fill="#b9821f" d="M11 33c-.552 0-1-.448-1-1v-3c0-.552.448-1 1-1h14c.552 0 1 .448 1 1s-.448 1-1 1H12v2c0 .552-.448 1-1 1z"/>
    <path fill="#eebd52" d="M25 21c.552 0 1 .448 1 1v3c0 .552-.448 1-1 1H11c-.552 0-1-.448-1-1s.448-1 1-1h13v-2c0-.552.448-1 1-1z"/>
    <path fill="#b9821f" d="M11 26c-.552 0-1-.448-1-1v-3c0-.552.448-1 1-1h14c.552 0 1 .448 1 1s-.448 1-1 1H12v2c0 .552-.448 1-1 1zm0-11c-.552 0-1-.448-1-1V4c0-.552.448-1 1-1h14c.552 0 1 .448 1 1s-.448 1-1 1H12v9c0 .552-.448 1-1 1z"/>

</defs>

  <g class="anim" style="--d:0.0625s"><use data-pos="L" href="#doorBrown" x="37"  y="34" width="168" height="168"/></g>
  <g class="anim" style="--d:0.0625s"><use data-pos="M" href="#doorGold"  x="236" y="34" width="168" height="168"/></g>
  <g class="anim" style="--d:0.0625s"><use data-pos="R" href="#doorBrown" x="435" y="34" width="168" height="168"/></g>

  <!-- three canonical routes (one per door). Repeat visits reuse the exact same path, drawn slightly thicker

  <path class="arcPast" style="--d:0.375s" d="M320,456 Q216,325 112,216" fill="none" stroke-width="3.9"   stroke-linecap="round"/>

  <path class="arc" style="--d:0.375s" d="M320,456 Q216,325 112,216" fill="none" stroke-width="3.9"   stroke-linecap="round"/>

  <path class="arc" style="--d:2.25s" d="M320,456 Q320,325 320,214" fill="none" stroke-width="3.9"   stroke-linecap="round"/>
  <path class="arc" style="--d:3.1875s" d="M320,456 Q216,325 112,216" fill="none" stroke-width="5.2"   stroke-linecap="round"/>
  <path class="arc" style="--d:4.125s" d="M320,456 Q216,325 112,216" fill="none" stroke-width="6.5"   stroke-linecap="round"/>
  <path class="arc" style="--d:5.0625s" d="M320,456 Q424,325 528,216" fill="none" stroke-width="5.2"   stroke-linecap="round"/>
  <path class="arc" style="--d:6.0s" d="M320,456 Q320,325 320,214" fill="none" stroke-width="5.2"   stroke-linecap="round"/>
  <path class="arc" style="--d:6.9375s" d="M320,456 Q424,325 528,216" fill="none" stroke-width="6.5"   stroke-linecap="round"/>
  <path class="arc" style="--d:7.875s" d="M320,456 Q320,325 320,214" fill="none" stroke-width="6.5"   stroke-linecap="round"/>
  <path class="arc" style="--d:8.8125s" d="M320,456 Q216,325 112,216" fill="none" stroke-width="7.8"   stroke-linecap="round"/>


  <!-- agent: drawn after the trajectories so it always renders above the lines -->
  <circle class="anim agent" style="--d:0.2875s" cx="320" cy="456" r="28" fill="#d7e0ef" stroke="#13224d" stroke-width="4"/>

  <!-- y-axis label: rotated and set beside the axis, with clear breathing room, the way axis titles are normally placed

  </g>

    <circle cx="78" cy="752" r="8"/><circle cx="134.4" cy="752" r="8"/><circle cx="190.9" cy="552" r="8"/><circle cx="247.3" cy="752" r="8"/><circle cx="303.8" cy="752" r="8"/><circle cx="360.2" cy="752" r="8"/><circle cx="416.7" cy="552" r="8"/><circle cx="473.1" cy="752" r="8"/><circle cx="529.6" cy="552" r="8"/><circle cx="586" cy="752" r="8"/>
  </g>
  <!-- current-step marker: pops in navy at each point and stays (gold = hit the goal door, permanent) -->

  <circle class="pulse"     style="--d:6.9875s" cx="473.1" cy="752" r="8"/>
  <circle class="pulse hit" style="--d:7.925s" cx="529.6" cy="552" r="8"/>
  <circle class="pulse"     style="--d:8.8625s" cx="586"   cy="752" r="8"/>

  <text class="anim" style="--d:0.25s" x="320" y="926" text-anchor="middle"
    font-size="42" fill="#8b1a1a"><tspan font-style="italic">i.i.d.</tspan> exploration</text>

  <!-- ================= HOVER BUBBLE: three expert rollouts are generated, then distilled ================= -->
  <g class="bubble">
    <rect x="6" y="6" width="628" height="998" rx="20" fill="#fdfcff" stroke="#e3e0ea" stroke-width="1.5"/>

    <!-- dotted box: the collected expert data, three episodes with the goal behind a different door each time -->
    <rect class="bline" style="--bd:0.06s" x="140" y="64" width="360" height="724" rx="20"

    <!-- row 1: goal behind the LEFT door -->

    <g class="bline" style="--bd:0.36s"><use href="#doorBrown" x="392" y="320" width="84" height="84"/></g>
    <path class="barc" style="--bd:0.54s" d="M320,506 Q320,450 320,398" fill="none" stroke-width="5.5" stroke-linecap="round"/>
    <circle class="bagent" style="--bd:0.54s;offset-path:path('M320,506 Q320,450 320,398')" r="16" fill="#d7e0ef" stroke="#13224d" stroke-width="3.5"/>

    <!-- row 3: goal behind the RIGHT door -->
    <g class="bline" style="--bd:0.60s"><use href="#doorBrown" x="164" y="560" width="84" height="84"/></g>

    <g class="bline" style="--bd:0.60s"><use href="#doorGold"  x="392" y="560" width="84" height="84"/></g>
    <path class="barc" style="--bd:0.78s" d="M320,746 Q380,670 434,620" fill="none" stroke-width="5.5" stroke-linecap="round"/>
    <circle class="bagent" style="--bd:0.78s;offset-path:path('M320,746 Q380,670 434,620')" r="16" fill="#d7e0ef" stroke="#13224d" stroke-width="3.5"/>

    <!-- arrow from the collected demonstrations to the distilled policy -->

      <text x="320" y="896" text-anchor="middle" font-size="32" font-weight="700" fill="#1f3f7a">BC Policy</text>
    </g>
  </g>

</svg>
<script>
(function(){
  // the goal door is shuffled on every page load: three variants (gold behind L, M or R).
  // The hover bubble always keeps its fixed order.
  var ROUTES={
    L:{d:'M320,456 Q216,325 112,216',out:[[268,392],[216,330],[164,272],[112,216]]},
    M:{d:'M320,456 Q320,325 320,214',out:[[320,392],[320,330],[320,271],[320,214]]},
    R:{d:'M320,456 Q424,325 528,216',out:[[372,392],[424,330],[476,272],[528,216]]}
  };
  // EPS is BC's FIXED physical door sequence (i.i.d., goal-blind): the agent visits the
  // same doors regardless of where the goal is. Changing the goal variant only moves
  // which episodes earn +1 (sequence door === gold door), so the reward curve is
  // rebuilt per variant while the arcs/agent keyframes never change.
  var EPS=['L','R','M','L','L','R','M','R','M','L'];
  var XS=[78,134.4,190.9,247.3,303.8,360.2,416.7,473.1,529.6,586];
  var DUR=9.6875,REST=[320,456];
  function kf(t,pt){return (t/DUR*100).toFixed(2)+'%{cx:'+pt[0]+'px;cy:'+pt[1]+'px;}';}
  function buildMove(){
    var s='0%{cx:'+REST[0]+'px;cy:'+REST[1]+'px;}';
    for(var i=0;i<EPS.length;i++){
      var t0=0.375+0.9375*i,S=ROUTES[EPS[i]].out;
      s+=kf(t0,REST)+kf(t0+.125,S[0])+kf(t0+.25,S[1])+kf(t0+.375,S[2])+kf(t0+.5,S[3])+kf(t0+.6875,S[3]);
      s+=kf(t0+.734375,S[2])+kf(t0+.78125,S[1])+kf(t0+.828125,S[0])+kf(t0+.875,REST);
    }
    return '@keyframes agentMove{'+s+'}';
  }
  function applyVariant(f,v){
    [].forEach.call(f.querySelectorAll('use[data-pos]'),function(u){u.setAttribute('href',u.getAttribute('data-pos')===v?'#doorGold':'#doorBrown');});
    var ys=EPS.map(function(e){return e===v?552:752;});
    var gp=f.querySelector('path.rGhost');
    if(gp){var d='M'+XS[0]+','+ys[0];for(var i=1;i<10;i++)d+=' L'+XS[i]+','+ys[i];gp.setAttribute('d',d);}
    [].forEach.call(f.querySelectorAll('path.draw'),function(p,i){p.setAttribute('d','M'+XS[i]+','+ys[i]+' L'+XS[i+1]+','+ys[i+1]);});
    [].forEach.call(f.querySelectorAll('g.anim[fill="#e2deec"] circle'),function(c,i){c.setAttribute('cy',ys[i%10]);});
    [].forEach.call(f.querySelectorAll('circle.pulse'),function(c,i){c.setAttribute('cy',ys[i]);c.classList[EPS[i]===v?'add':'remove']('hit');});
    var st=document.getElementById('vkf');
    if(!st){st=document.createElement('style');st.id='vkf';document.head.appendChild(st);}
    st.textContent=buildMove();
  }
  function prep(f){f.querySelectorAll('.draw,.arc,.barc').forEach(function(p){try{var l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;p.style.setProperty('--len',l);}catch(e){}});}
  function play(f){f.classList.remove('play');void f.getBoundingClientRect();f.classList.add('play');}
  var figs=[].slice.call(document.querySelectorAll('.fig'));
  var v=(location.search.match(/[?&]v=([LMR])/)||[])[1]||['L','M','R'][Math.floor(Math.random()*3)];
  figs.forEach(function(f){try{applyVariant(f,v);prep(f);}catch(e){}f.addEventListener('click',function(){play(f);});});
  var played=false, iv=null, LOOP_MS=25000; // shared by all four panels: longest animation (23s) + 2s hold, so replays stay in lockstep
  function start(){if(played)return;played=true;figs.forEach(play);iv=setInterval(function(){figs.forEach(play);},LOOP_MS);}
  window.addEventListener('message',function(e){
    if(!e.data)return;
    if(e.data.type==='lmp-play'){start();}
    if(e.data.type==='lmp-sync'){played=true;if(iv){clearInterval(iv);iv=null;}figs.forEach(play);}
    if(e.data.type==='lmp-variant'&&/^[LMR]$/.test(e.data.v)&&e.data.v!==v){
      v=e.data.v;figs.forEach(function(f){try{applyVariant(f,v);prep(f);if(played)play(f);}catch(err){}});
    }
  });
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){start();}});},{threshold:0.4}).observe(document.querySelector('.fig'));
  }
}());
</script>
</body>
