<title>figDAgger</title>
<style>
html,body{margin:0;padding:0;background:transparent;}
.fig{width:100%;height:auto;display:block;cursor:pointer;}
.fig text{font-family:'Google Sans','Noto Sans',sans-serif;}

.fig .anim{opacity:0;}
.fig.play .anim{animation:riseIn 1.0s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--d,0s);}
@keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* trajectory arcs: draw in navy (current step), settle to light gray (history) — same grammar as the BC panel */
.fig .arc{opacity:0;stroke:#e2deec;}
.fig.play .arc{animation:arcDraw .9375s linear both;animation-delay:var(--d,0s);}
@keyframes arcDraw{
  0%{opacity:0;stroke:#1f3f7a;stroke-dashoffset:var(--len,260);}
  14%{opacity:1;}
  55%{opacity:1;stroke:#1f3f7a;stroke-dashoffset:0;}
  85%{stroke:#1f3f7a;}
  100%{opacity:1;stroke:#e2deec;stroke-dashoffset:0;}
}

/* dithering happens in EPISODES, one per failure dot on the reward axis: the agent starts
   over from rest each time, the current scribble is navy, and every finished one hands off to
   solid light gray (history). Episodes shorten as the axis zooms — failures fly by faster. */
.fig .dscrib{opacity:0;stroke:#1f3f7a;}
.fig.play .dscrib{animation:dsDraw var(--dur,5s) linear both;animation-delay:var(--d,0s);}
.fig.play .dscrib.dgone{animation:dsDraw var(--dur,5s) linear both, dsFade .45s linear both;animation-delay:var(--d,0s),var(--df,20s);}
@keyframes dsDraw{0%{opacity:1;stroke-dashoffset:var(--len,2400);}100%{opacity:1;stroke-dashoffset:0;}}
@keyframes dsFade{from{opacity:1;}to{opacity:0;}}
.fig .dpast{opacity:0;stroke:#e2deec;}
.fig.play .dpast{animation:pastIn .45s linear both;animation-delay:var(--d,0s);}
@keyframes pastIn{from{opacity:0;}to{opacity:1;}}

/* failure dots on the zooming reward axis: they live in the zooming path space, so every zoom-out
   visibly squeezes the accumulated failures together; a counter-scale keeps each dot circular */
.fig .zdotS{transform-box:fill-box;transform-origin:50% 50%;}
.fig.play .zdotS{animation:zoomInv 23s both;}
@keyframes zoomInv{
  0%{transform:scale(1,1);animation-timing-function:linear;}
  43.48%{transform:scale(1,1);animation-timing-function:cubic-bezier(.4,0,.2,1);}
  46.96%{transform:scale(2,1);animation-timing-function:linear;}
  64.35%{transform:scale(2,1);animation-timing-function:cubic-bezier(.4,0,.2,1);}
  67.83%{transform:scale(4,1);animation-timing-function:linear;}
  85.22%{transform:scale(4,1);animation-timing-function:cubic-bezier(.4,0,.2,1);}
  88.70%{transform:scale(8,1);animation-timing-function:linear;}
  100%{transform:scale(8,1);}
}
.fig .zdot{opacity:0;fill:#1f3f7a;}
.fig.play .zdot{animation:zdotIn .4s linear both;animation-delay:var(--d,0s);}
@keyframes zdotIn{from{opacity:0;}to{opacity:1;}}

/* the reward line lives inside a group that zooms out each time the line hits the current axis limit.
   Path space is 8x the plot width; the group compresses 1 -> 1/2 -> 1/4 -> 1/8, so each refill of the
   right half covers ever more episodes. Draw speed doubles per stage to keep the visible pen speed even. */
.fig .zoomG{transform:scale(1,1);}
.fig.play .zoomG{animation:zoomOut 23s both;}
@keyframes zoomOut{
  0%{transform:scale(1,1);animation-timing-function:linear;}
  43.48%{transform:scale(1,1);animation-timing-function:cubic-bezier(.4,0,.2,1);}
  46.96%{transform:scale(.5,1);animation-timing-function:linear;}
  64.35%{transform:scale(.5,1);animation-timing-function:cubic-bezier(.4,0,.2,1);}
  67.83%{transform:scale(.25,1);animation-timing-function:linear;}
  85.22%{transform:scale(.25,1);animation-timing-function:cubic-bezier(.4,0,.2,1);}
  88.70%{transform:scale(.125,1);animation-timing-function:linear;}
  100%{transform:scale(.125,1);}
}
.fig .rw{opacity:0;}
.fig.play .rw{animation:rwDraw 23s linear both;}
@keyframes rwDraw{
  0%{opacity:0;stroke-dashoffset:3776;}
  26.08%{opacity:0;stroke-dashoffset:3776;}
  26.09%{opacity:1;stroke-dashoffset:3776;}
  43.48%{stroke-dashoffset:3268;}
  46.96%{stroke-dashoffset:3268;}
  64.35%{stroke-dashoffset:2760;}
  67.83%{stroke-dashoffset:2760;}
  85.22%{stroke-dashoffset:1744;}
  88.70%{stroke-dashoffset:1744;}
  100%{opacity:1;stroke-dashoffset:996;}
}

/* screen-space draw-in segments (the final rise): paint navy and stay navy */
.fig .draw{opacity:0;stroke:#e2deec;}
.fig.play .draw{animation:drawIn .9375s linear both;animation-delay:var(--d,0s);}
@keyframes drawIn{
  0%{opacity:0;stroke:#1f3f7a;stroke-dashoffset:var(--len,120);}
  16%{opacity:1;}
  50%{opacity:1;stroke:#1f3f7a;stroke-dashoffset:0;}
  100%{opacity:1;stroke:#1f3f7a;stroke-dashoffset:0;}
}

/* the current x-axis limit under the rightmost tick: counts up a decade at every zoom-out */
.fig .lab{opacity:0;}
.fig.play .lab1{animation:labA 23s linear both;}
.fig.play .lab2{animation:labB 23s linear both;}
.fig.play .lab3{animation:labC 23s linear both;}
.fig.play .lab4{animation:labD 23s linear both;}
@keyframes labA{0%{opacity:0;}2.2%{opacity:1;}43.48%{opacity:1;}46.96%{opacity:0;}100%{opacity:0;}}
@keyframes labB{0%{opacity:0;}43.48%{opacity:0;}46.96%{opacity:1;}64.35%{opacity:1;}67.83%{opacity:0;}100%{opacity:0;}}
@keyframes labC{0%{opacity:0;}64.35%{opacity:0;}67.83%{opacity:1;}85.22%{opacity:1;}88.70%{opacity:0;}100%{opacity:0;}}
@keyframes labD{0%{opacity:0;}85.22%{opacity:0;}88.70%{opacity:1;}100%{opacity:1;}}

/* marker at the end of the final rise: pops gold and stays */
.fig .pulse{opacity:0;transform-box:fill-box;transform-origin:50% 50%;fill:#1f3f7a;}
.fig.play .pulse{animation:pulseIn .9375s cubic-bezier(.34,1.2,.64,1) both;animation-delay:var(--d,0s);}
@keyframes pulseIn{
  0%{opacity:0;transform:scale(.3);}
  26%{opacity:1;transform:scale(1.5);}
  50%{transform:scale(1);}
  100%{opacity:1;transform:scale(1);fill:#1f3f7a;}
}
.fig .pulse.hit{fill:#e3a730 !important;animation-name:pulseInHit;}
@keyframes pulseInHit{
  0%{opacity:0;transform:scale(.3);fill:#e3a730;}
  26%{opacity:1;transform:scale(1.5);fill:#e3a730;}
  50%{transform:scale(1);fill:#e3a730;}
  100%{opacity:1;transform:scale(1);fill:#e3a730;}
}

/* hover bubble: why the agent dithers forever — per-step expert corrections on the wrong
   rollouts cancel out into a uniform policy. Same overlay mechanism as the BC panel, and the
   SAME draw-in/pulse-in animation grammar as the main panel — just replayed on every hover
   instead of once on load. */
.fig .bubble{opacity:0;pointer-events:none;transition:opacity .28s ease;}
.fig:hover .bubble{opacity:1;pointer-events:auto;}

.fig .bubble .breveal{opacity:0;}
.fig:hover .bubble .breveal{animation:riseIn .7s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--bd,0s);}

.fig .bubble .barc{opacity:0;stroke:#e2deec;}
.fig:hover .bubble .barc{animation:arcDraw .9375s linear both;animation-delay:var(--bd,0s);}

.fig .bubble .bdraw{opacity:0;stroke:#e3a730;}
.fig:hover .bubble .bdraw{animation:bDrawIn .35s linear both;animation-delay:var(--bd,0s);}

/* the agent rides the wrong rollout; each per-step correction pops the moment it passes that point */
.fig .bubble .bagent{opacity:0;offset-rotate:0deg;}
@supports (offset-path: path("M0,0 L1,1")){
  .fig:hover .bubble .bagent{animation:bRide .52s linear both;animation-delay:var(--bd,0s);}
}
@supports not (offset-path: path("M0,0 L1,1")){
  .fig:hover .bubble .bagent{animation:riseIn .7s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--bd,0s);}
}
@keyframes bRide{0%{opacity:0;offset-distance:0%;}4%{opacity:1;}100%{opacity:1;offset-distance:100%;}}
@keyframes bDrawIn{0%{opacity:0;stroke-dashoffset:var(--blen,80);}20%{opacity:1;}100%{opacity:1;stroke-dashoffset:0;}}

.fig .bubble .bpulse{opacity:0;transform-box:fill-box;transform-origin:50% 50%;fill:#1f3f7a;}
.fig:hover .bubble .bpulse{animation:pulseIn .9375s cubic-bezier(.34,1.2,.64,1) both;animation-delay:var(--bd,0s);}

/* right agent: sits at rest, then dithers along the scribble for the rest of the loop */

<script>
(function(){
  var si = window.setInterval;
  window.setInterval = function(fn, ms){
    return si(function(){ if (!document.body.classList.contains('animoff')) fn(); }, ms);
  };
  function apply(vis){ document.body.classList.toggle('animoff', !vis); }
  var inView = true;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(es){
      inView = es[0].isIntersecting; apply(inView && !document.hidden);
    }, {threshold: 0.05}).observe(document.documentElement);
  }
  document.addEventListener('visibilitychange', function(){ apply(inView && !document.hidden); });
}());
</script>

<script>
(function(){
  // the goal door is shuffled on every page load; the hover bubble always keeps its fixed order
  function applyVariant(f,v){
    [].forEach.call(f.querySelectorAll('use[data-pos]'),function(u){u.setAttribute('href',u.getAttribute('data-pos')===v?'#doorGold':'#doorBrown');});
  }
  function prep(f){
    f.querySelectorAll('.draw,.arc,.dscrib,.barc').forEach(function(p){try{var l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;p.style.setProperty('--len',l);}catch(e){}});
    f.querySelectorAll('.bdraw').forEach(function(p){try{var l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;p.style.setProperty('--blen',l);}catch(e){}});
  }
  function play(f){f.classList.remove('play');void f.getBoundingClientRect();f.classList.add('play');}
  var figs=[].slice.call(document.querySelectorAll('.fig'));
  var v=(location.search.match(/[?&]v=([LMR])/)||[])[1]||['L','M','R'][Math.floor(Math.random()*3)];
  figs.forEach(function(f){try{applyVariant(f,v);prep(f);}catch(e){}f.addEventListener('click',function(){play(f);});});
  var played=false, iv=null, LOOP_MS=25000; // shared by all four panels: longest animation (23s) + 2s hold, so replays stay in lockstep
  function start(){if(played)return;played=true;figs.forEach(play);iv=setInterval(function(){figs.forEach(play);},LOOP_MS);}
  window.addEventListener('message',function(e){
    if(!e.data)return;
    if(e.data.type==='lmp-play'){start();}
    if(e.data.type==='lmp-sync'){played=true;if(iv){clearInterval(iv);iv=null;}figs.forEach(play);}
    if(e.data.type==='lmp-variant'&&/^[LMR]$/.test(e.data.v)&&e.data.v!==v){
      v=e.data.v;figs.forEach(function(f){try{applyVariant(f,v);prep(f);if(played)play(f);}catch(err){}});
    }
  });
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){start();}});},{threshold:0.4}).observe(document.querySelector('.fig'));
  }
}());
</script>
