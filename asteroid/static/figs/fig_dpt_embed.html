<title>figDPT</title>
<style>
html,body{margin:0;padding:0;background:transparent;}
.fig{width:100%;height:auto;display:block;cursor:pointer;}
.fig text{font-family:'Google Sans','Noto Sans',sans-serif;}

.fig .anim{opacity:0;}
.fig.play .anim{animation:riseIn 1.0s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--d,0s);}
@keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* one recorded offline rollout per context cell: a long scribble that draws in and stays navy (it is the data) */
.fig .scrib{opacity:0;stroke:#1f3f7a;}
.fig.play .scrib{animation:scribDraw var(--dur,3.4s) linear both, scribFade .5s linear both;animation-delay:var(--d,0s),calc(var(--d,0s) + var(--dur,3.4s));}
@keyframes scribDraw{
  0%{opacity:1;stroke-dashoffset:var(--len,2000);}
  100%{opacity:1;stroke-dashoffset:0;}
}
/* only the rollout being recorded right now is navy; finished recordings hand off to a
   solid light-gray copy — same past-trajectory grammar as the other panels */
@keyframes scribFade{from{opacity:1;}to{opacity:0;}}
.fig .scribPast{opacity:0;stroke:#e2deec;}
.fig.play .scribPast{animation:pastIn .5s linear both;animation-delay:calc(var(--d,0s) + var(--dur,3.4s));}
@keyframes pastIn{from{opacity:0;}to{opacity:1;}}

/* a mini agent rides each rollout while it records, then fades out as it settles */
.fig .mini{opacity:0;offset-rotate:0deg;}
@supports (offset-path: path("M0,0 L1,1")) {
  .fig.play .mini{animation:miniRide var(--dur,3.4s) linear both, miniFade .45s linear forwards;animation-delay:var(--d,0s),calc(var(--d,0s) + var(--dur,3.4s));}
}
@keyframes miniRide{0%{opacity:0;offset-distance:0%;}4%{opacity:1;}100%{opacity:1;offset-distance:100%;}}
@keyframes miniFade{to{opacity:0;}}

/* once the four sampled contexts are in, the grid zooms out: coverage must extend to EVERY possible context */
.fig .gz{transform:scale(1);}
.fig.play .gz{animation:gzOut 23s both;}
@keyframes gzOut{
  0%{transform:scale(1);animation-timing-function:linear;}
  52.17%{transform:scale(1);animation-timing-function:cubic-bezier(.4,0,.2,1);}
  57.39%{transform:scale(.5);animation-timing-function:linear;}
  100%{transform:scale(.5);}
}

/* hover bubble: the offline dataset (many recorded rollouts) plus the expert policy get
   distilled together into a single DPT policy. Same overlay + replay-on-hover mechanism
   as the BC and DAgger panels. */
.fig .bubble{opacity:0;pointer-events:none;transition:opacity .28s ease;}
.fig:hover .bubble{opacity:1;pointer-events:auto;}

.fig .bubble .breveal{opacity:0;}
.fig:hover .bubble .breveal{animation:riseIn .7s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--bd,0s);}

.fig .bubble .bpulse{opacity:0;transform-box:fill-box;transform-origin:50% 50%;fill:#1f3f7a;}
.fig:hover .bubble .bpulse{animation:pulseIn .8s cubic-bezier(.34,1.2,.64,1) both;animation-delay:var(--bd,0s);}
@keyframes pulseIn{
  0%{opacity:0;transform:scale(.3);}
  26%{opacity:1;transform:scale(1.5);}
  50%{transform:scale(1);}
  100%{opacity:1;transform:scale(1);}
}
</style>

<script>
(function(){
  var si = window.setInterval;
  window.setInterval = function(fn, ms){
    return si(function(){ if (!document.body.classList.contains('animoff')) fn(); }, ms);
  };
  function apply(vis){ document.body.classList.toggle('animoff', !vis); }
  var inView = true;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(es){
      inView = es[0].isIntersecting; apply(inView && !document.hidden);
    }, {threshold: 0.05}).observe(document.documentElement);
  }
  document.addEventListener('visibilitychange', function(){ apply(inView && !document.hidden); });
}());
</script>

<script>
(function(){
  function prep(f){f.querySelectorAll('.scrib').forEach(function(p){try{var l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;p.style.setProperty('--len',l);}catch(e){}});}
  function play(f){f.classList.remove('play');void f.getBoundingClientRect();f.classList.add('play');}
  var figs=[].slice.call(document.querySelectorAll('.fig'));
  figs.forEach(function(f){try{prep(f);}catch(e){}f.addEventListener('click',function(){play(f);});});
  var played=false, iv=null, LOOP_MS=25000; // shared by all four panels: longest animation (23s) + 2s hold, so replays stay in lockstep
  function start(){if(played)return;played=true;figs.forEach(play);iv=setInterval(function(){figs.forEach(play);},LOOP_MS);}
  window.addEventListener('message',function(e){
    if(!e.data)return;
    if(e.data.type==='lmp-play'){start();}
    if(e.data.type==='lmp-sync'){played=true;if(iv){clearInterval(iv);iv=null;}figs.forEach(play);}
  });
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){start();}});},{threshold:0.4}).observe(document.querySelector('.fig'));
  }
}());
</script>
