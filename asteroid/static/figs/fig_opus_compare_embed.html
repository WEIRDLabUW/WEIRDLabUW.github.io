<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>figOpusCompare</title>
<script src="https://cdn.plot.ly/plotly-gl3d-2.35.2.min.js" charset="utf-8"></script>
<script src="explore_viz/cmp_data.js"></script>
<script src="explore_viz/opus_data.js"></script>
<script>window.TACTILE_DATA = window.TACTILE_DATA || { _fmax: (window.CMP_DATA||{})._fmax };</script>
<script src="explore_viz/viz_common.js"></script>
<style>
html,body{margin:0;padding:0;background:transparent;font-family:'Google Sans','Noto Sans',sans-serif;color:#1c1d22;}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:820px){.wrap{grid-template-columns:1fr;}}
/* bar plot */
.bars{padding:4px 2px;}
.bars h4{margin:0 0 10px;font-size:14px;font-weight:600;color:#55525e;}
.bars h4 small{font-weight:400;color:#8b8698;}
.brow{display:flex;flex-direction:column;align-items:center;}
.bplot{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:180px;border-bottom:1.5px solid #c8c9cf;padding:0 6px;}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:44px;position:relative;cursor:pointer;}
.bfill{width:100%;border-radius:4px 4px 0 0;transition:opacity .2s;}
.bval{font-size:14px;font-weight:700;margin-bottom:4px;}
.berr{position:absolute;left:50%;width:0;border-left:1.5px solid rgba(0,0,0,.45);}
.blabs{display:flex;justify-content:center;gap:14px;padding:6px 6px 0;}
.blabs span{width:44px;text-align:center;font-size:11.5px;line-height:1.2;color:#55525e;}
.bref{margin-top:14px;font-size:12px;color:#8b8698;line-height:1.5;}
.bref b{color:#55525e;font-weight:600;}
/* rollout sides */
.side{border:1.5px solid #e4e5ea;border-radius:14px;padding:10px;transition:border-color .2s,opacity .2s;}
.side.ours{border-color:#b9c8de;}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.sname{font-size:16px;font-weight:700;}
.ours .sname{color:#003366;}
.llm .sname{color:#8a5a2b;}
.pills{display:flex;gap:6px;}
.pill{border:1.5px solid #c9c4d4;background:#fff;color:#55525e;border-radius:999px;font-family:inherit;font-size:12px;font-weight:600;padding:4px 11px;cursor:pointer;}
.pill.on{background:#1c1d22;border-color:#1c1d22;color:#fff;}
.prow{display:grid;grid-template-columns:1fr 1.7fr;gap:8px;margin-bottom:8px;}
.cell{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:auto;}
.cell video{width:100%;height:100%;object-fit:cover;display:block;}
.cell.w{aspect-ratio:1/1;}
.cell.s{aspect-ratio:16/9.4;}
.ctag{position:absolute;left:6px;top:6px;background:rgba(255,255,255,.9);color:#333;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:6px;}
.plot3d{width:100%;height:210px;}
.note{font-size:12.5px;color:#55525e;margin-top:6px;min-height:2.6em;display:flex;gap:6px;align-items:flex-start;}
.badge{flex:0 0 auto;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="bars">
    <h4>Success, wrist camera only <small>(32 s)</small></h4>
    <div class="brow">
      <div class="bplot" id="bplot"></div>
      <div class="blabs" id="blabs"></div>
    </div>
  </div>
  <div class="side ours" id="side0">
    <div class="shead"><span class="sname">ASTEROID</span><div class="pills" id="pills0"></div></div>
    <div class="prow"><div class="cell w"><video id="wrist0" muted playsinline preload="metadata"></video><span class="ctag">wrist camera</span></div>
      <div class="cell s"><video id="vid0" muted playsinline preload="metadata"></video></div></div>
    <div class="plot3d" id="traj0"></div>
    <div class="note" id="note0"></div>
  </div>
  <div class="side llm" id="side1">
    <div class="shead"><span class="sname">Claude Opus 5.5</span><div class="pills" id="pills1"></div></div>
    <div class="prow"><div class="cell w"><video id="wrist1" muted playsinline preload="metadata"></video><span class="ctag">wrist camera</span></div>
      <div class="cell s"><video id="vid1" muted playsinline preload="metadata"></video></div></div>
    <div class="plot3d" id="traj1"></div>
    <div class="note" id="note1"></div>
  </div>
</div>

<script>
(function(){
  // ASTEROID vs Claude Opus 5.5 on wrist-camera peg insertion: synced wrist + scene
  // video and 3D end-effector path per side (viz_common.js), plus the success bars
  // (comparison_table.json in llm_info.zip; learned policies 3 seeds, Opus 20 eps).
  var BARS = [
    { name:'ASTEROID', v:0.783, se:0.044, c:'#003366' },
    { name:'Opus 5.5', v:0.50, se:0.112, c:'#c98a4b' },
    { name:'BC', v:0.167, se:0.033, c:'#9aa5b1' }
  ];
  var bplot = document.getElementById('bplot'), blabs = document.getElementById('blabs');
  BARS.forEach(function(b){
    var col = document.createElement('div'); col.className = 'bcol';
    col.innerHTML = '<span class="bval" style="color:'+b.c+'">'+Math.round(b.v*100)+'%</span>' +
      '<div class="bfill" style="height:'+(b.v*100*0.82)+'%;background:'+b.c+'"></div>' +
      '<span class="berr" style="bottom:'+((b.v-b.se)*100*0.82)+'%;height:'+(2*b.se*100*0.82)+'%"></span>';
    bplot.appendChild(col);
    var l = document.createElement('span'); l.textContent = b.name; blabs.appendChild(l);
  });

  var SIDES = [
    { rolls: CMP_DATA.tasks.peg.methods.asteroid.rolls, labels:['1','2','3'],
      notes: function(r){ return 'Sweeps the table with the wrist camera, finds the peg, inserts.'; } },
    { rolls: OPUS_DATA.rolls, labels:['failure','success'],
      notes: function(r){ return r.note; } }
  ];
  var refs = [null, null];

  function setRoll(s, i){
    var side = SIDES[s], roll = side.rolls[i];
    var video = document.getElementById('vid'+s), wrist = document.getElementById('wrist'+s);
    [].forEach.call(document.getElementById('pills'+s).children, function(p, k){ p.className = 'pill' + (k === i ? ' on' : ''); });
    document.getElementById('note'+s).innerHTML = '<span class="badge">' + (roll.success ? '✅' : '❌') + '</span><span>' + side.notes(roll) + '</span>';
    video.src = roll.vid; wrist.src = roll.vid.replace(/\.mp4$/, '_wrist.mp4');
    video.loop = true; wrist.loop = true;
    video.playbackRate = 0.8; wrist.playbackRate = 0.8;
    if (!refs[s]) {
      VIZ.buildPair(null, 'traj'+s, roll, true);
      VIZ.bindSeek('traj'+s, function(){ return video; }, function(){ return refs[s].n; });
      video.onseeked = function(){ if (wrist.duration) wrist.currentTime = video.currentTime; };
    } else {
      VIZ.updateData(null, 'traj'+s, roll, true);
    }
    refs[s] = { video:video, wrist:wrist, D:roll, n:roll.traj.length, last:-1 };
    if (VIZ.isVisible()) { video.play().catch(function(){}); wrist.play().catch(function(){}); }
  }

  SIDES.forEach(function(side, s){
    var bar = document.getElementById('pills'+s);
    side.labels.forEach(function(lab, i){
      var b = document.createElement('button'); b.className = 'pill'; b.textContent = lab;
      b.addEventListener('click', function(){ setRoll(s, i); });
      bar.appendChild(b);
    });
  });

  function frame(){
    if (VIZ.isVisible()) {
      refs.forEach(function(r, s){
        if (!r) return;
        var d = r.video.duration;
        if (d && isFinite(d) && d > 0) {
          var k = Math.min(r.n-1, Math.floor(r.video.currentTime / d * r.n));
          if (k !== r.last) { r.last = k; VIZ.step(null, 'traj'+s, r.D, k); }
          if (r.wrist.duration && Math.abs(r.wrist.currentTime - r.video.currentTime) > 0.25) r.wrist.currentTime = r.video.currentTime;
        }
      });
    }
    requestAnimationFrame(frame);
  }

  var started = false;
  VIZ.onVisible(function(v){
    if (v && !started) { started = true; setRoll(0, 0); setRoll(1, 0); requestAnimationFrame(frame); return; }
    if (!started) return;
    refs.forEach(function(r){
      if (!r) return;
      if (v) { r.video.play().catch(function(){}); r.wrist.play().catch(function(){}); }
      else { r.video.pause(); r.wrist.pause(); }
    });
  });

  function reportH(){
    try { window.parent.postMessage({ type:'lmp-figheight', height: document.body.scrollHeight }, '*'); } catch(e){}
  }
  window.addEventListener('load', function(){ reportH(); setTimeout(reportH, 600); });
  window.addEventListener('resize', reportH);
}());
</script>
</body>
</html>
