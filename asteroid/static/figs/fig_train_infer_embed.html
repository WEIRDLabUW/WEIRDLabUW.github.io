<!DOCTYPE html>

<title>figTrainInfer</title>
<style>
html,body{margin:0;padding:0;background:transparent;}
.fig{width:100%;height:auto;display:block;cursor:pointer;}

.fig .anim{opacity:0;}
.fig.play .anim{animation:riseIn 1.0s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--d,0s);}
@keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* chips / doors / badges pop in (nested inside a positioning <g> — CSS transform
   animations override the SVG transform attribute, so never merge the two) */
.fig .tok{opacity:0;transform-box:fill-box;transform-origin:50% 100%;}
.fig.play .tok{animation:tokIn .62s cubic-bezier(.34,1.4,.64,1) both;animation-delay:var(--d,0s);}
@keyframes tokIn{0%{opacity:0;transform:scale(.2);}60%{opacity:1;transform:scale(1.12);}100%{opacity:1;transform:scale(1);}}

/* solid arrows draw via stroke-dashoffset (--len set by JS) */
.fig .grow{opacity:0;}
.fig.play .grow{animation:growDraw var(--dur,.5s) linear both;animation-delay:var(--d,0s);}
@keyframes growDraw{0%{opacity:1;stroke-dashoffset:var(--len,200);}100%{opacity:1;stroke-dashoffset:0;}}

/* dashed strokes just fade in (dash-array + dashoffset don't mix) */
.fig .dfade{opacity:0;}
.fig.play .dfade{animation:dIn .5s linear both;animation-delay:var(--d,0s);}
@keyframes dIn{from{opacity:0;}to{opacity:1;}}

/* arrowheads pop after their line lands */
.fig .pop{opacity:0;}
.fig.play .pop{animation:dIn .25s linear both;animation-delay:var(--d,0s);}

/* gold highlight (retrieved dataset entry): pops and stays */
.fig .ring{opacity:0;transform-box:fill-box;transform-origin:50% 50%;}
.fig.play .ring{animation:ringIn .68s cubic-bezier(.34,1.3,.64,1) both;animation-delay:var(--d,0s);}
@keyframes ringIn{0%{opacity:0;transform:scale(.6);}60%{opacity:1;transform:scale(1.12);}100%{opacity:1;transform:scale(1);}}

/* wrapper that recedes when its moment has passed (supervision drops after
   training, each retrieval spotlight after its step) */
.fig.play .lateDim{animation:lateDimA .8s linear both;animation-delay:var(--ld,0s);}
@keyframes lateDimA{from{opacity:1;}to{opacity:var(--lo,0.35);}}

/* retrieval: the expert answer flies from the dataset entry into the action slot */
.fig .fly,.fig .flyStay{opacity:0;}
.fig.play .fly{animation:flyOnce 1.5s cubic-bezier(.35,.1,.3,1) both;animation-delay:var(--d,0s);}
@keyframes flyOnce{0%{opacity:0;transform:translate(var(--x0),var(--y0)) scale(.75);}12%{opacity:1;}60%{opacity:1;transform:translate(var(--x1),var(--y1)) scale(1);}85%{opacity:1;transform:translate(var(--x1),var(--y1)) scale(1);}100%{opacity:0;transform:translate(var(--x1),var(--y1)) scale(1);}}
.fig.play .flyStay{animation:flyKeep 1.5s cubic-bezier(.35,.1,.3,1) both;animation-delay:var(--d,0s);}
@keyframes flyKeep{0%{opacity:0;transform:translate(var(--x0),var(--y0)) scale(.75);}12%{opacity:1;}60%{opacity:1;transform:translate(var(--x1),var(--y1)) scale(1);}100%{opacity:1;transform:translate(var(--x1),var(--y1)) scale(1);}}
</style>
</head>
<body>
<style>body.animoff svg *{animation-play-state:paused!important;}</style>
<script>
(function(){
  var si = window.setInterval;
  window.setInterval = function(fn, ms){
    return si(function(){ if (!document.body.classList.contains('animoff')) fn(); }, ms);
  };
  function apply(vis){ document.body.classList.toggle('animoff', !vis); }
  var inView = true;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(es){
      inView = es[0].isIntersecting; apply(inView && !document.hidden);
    }, {threshold: 0.05}).observe(document.documentElement);
  }
  document.addEventListener('visibilitychange', function(){ apply(inView && !document.hidden); });
}());
</script>

<script>
(function(){
  var figs=[].slice.call(document.querySelectorAll('.fig'));
  function prep(f){f.querySelectorAll('.grow').forEach(function(p){try{var l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;p.style.setProperty('--len',l);}catch(e){}});}
  function play(f){f.classList.remove('play');void f.getBoundingClientRect();f.classList.add('play');}
  figs.forEach(function(f){try{prep(f);}catch(e){}f.addEventListener('click',function(){play(f);});});
  var played=false, LOOP_MS=26300; // ~21.3s of animation + a 5s hold before it loops
  function start(){if(played)return;played=true;figs.forEach(play);setInterval(function(){figs.forEach(play);},LOOP_MS);}
  window.addEventListener('message',function(e){
    if(e.data&&e.data.type==='lmp-play'){start();}
  });
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){start();}});},{threshold:0.4}).observe(document.querySelector('.fig'));
  }
}());
</script>
