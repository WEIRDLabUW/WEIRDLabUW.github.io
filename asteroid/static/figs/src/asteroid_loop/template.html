<title>figASTEROIDLoop</title>
<style>
html,body{margin:0;padding:0;background:transparent;}
.fig{width:100%;height:auto;display:block;cursor:pointer;}

.fig .anim{opacity:0;}
.fig.play .anim{animation:riseIn 1.0s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--d,0s);}
@keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* token cubes / actors pop in (nested inside a positioning <g> — CSS transform
   animations override the SVG transform attribute, so never merge the two) */
.fig .tok{opacity:0;transform-box:fill-box;transform-origin:50% 100%;}
.fig.play .tok{animation:tokIn .55s cubic-bezier(.34,1.4,.64,1) both;animation-delay:var(--d,0s);}
@keyframes tokIn{0%{opacity:0;transform:scale(.2);}60%{opacity:1;transform:scale(1.12);}100%{opacity:1;transform:scale(1);}}

/* solid arrows draw via stroke-dashoffset (--len set by JS) */
.fig .grow{opacity:0;}
.fig.play .grow{animation:growDraw var(--dur,.45s) linear both;animation-delay:var(--d,0s);}
@keyframes growDraw{0%{opacity:1;stroke-dashoffset:var(--len,200);}100%{opacity:1;stroke-dashoffset:0;}}

/* dashed strokes just fade in (dash-array + dashoffset don't mix) */
.fig .dfade{opacity:0;}
.fig.play .dfade{animation:dIn .45s linear both;animation-delay:var(--d,0s);}
@keyframes dIn{from{opacity:0;}to{opacity:1;}}

/* arrowheads pop after their line lands */
.fig .pop{opacity:0;}
.fig.play .pop{animation:dIn .22s linear both;animation-delay:var(--d,0s);}

/* tokens fly from the collected strips into the loss and STAY as its arguments:
   context cubes land as the condition, then the observation, then the expert
   action as the target (0% keeps opacity 0 so fill-mode backfill can't reveal
   them before their delay) */
.fig .flyLand{opacity:0;}
.fig.play .flyLand{animation:flyLand .85s cubic-bezier(.35,.1,.35,1) both;animation-delay:var(--d,0s);}
@keyframes flyLand{
  0%{opacity:0;transform:translate(var(--x0),var(--y0)) scale(1);}
  10%{opacity:1;}
  100%{opacity:1;transform:translate(var(--x1),var(--y1)) scale(var(--s1,1));}
}

/* gold ring marking the sampled world: pops and stays */
.fig .ring{opacity:0;transform-box:fill-box;transform-origin:50% 50%;}
.fig.play .ring{animation:ringIn .6s cubic-bezier(.34,1.3,.64,1) both;animation-delay:var(--d,0s);}
@keyframes ringIn{0%{opacity:0;transform:scale(.4);}60%{opacity:1;transform:scale(1.18);}100%{opacity:1;transform:scale(1);}}
</style>
</head>

<style>body.animoff svg *{animation-play-state:paused!important;}</style>
<script>
(function(){
  var si = window.setInterval;
  window.setInterval = function(fn, ms){
    return si(function(){ if (!document.body.classList.contains('animoff')) fn(); }, ms);
  };
  function apply(vis){ document.body.classList.toggle('animoff', !vis); }
  var inView = true;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(es){
      inView = es[0].isIntersecting; apply(inView && !document.hidden);
    }, {threshold: 0.05}).observe(document.documentElement);
  }
  document.addEventListener('visibilitychange', function(){ apply(inView && !document.hidden); });
}());
</script>

    });
  }
  function prep(f){f.querySelectorAll('.grow').forEach(function(p){try{var l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;p.style.setProperty('--len',l);}catch(e){}});}
  function play(f){applyWorld(f);f.classList.remove('play');void f.getBoundingClientRect();f.classList.add('play');k=(k+1)%3;}
  figs.forEach(function(f){try{applyWorld(f);prep(f);}catch(e){}f.addEventListener('click',function(){play(f);});});
  var played=false, timer=null, LOOP_MS=19600; // ~14.6s of animation + a 5s hold, then a fresh world is sampled
  function schedule(){if(timer)clearInterval(timer);timer=setInterval(function(){figs.forEach(play);},LOOP_MS);}
  function start(){if(played)return;played=true;figs.forEach(play);schedule();}
  window.addEventListener('message',function(e){
    if(e.data&&e.data.type==='lmp-play'){start();}
    if(e.data&&e.data.type==='lmp-replay'){if(!played){start();}else{figs.forEach(play);schedule();}}
  });
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){start();}});},{threshold:0.4}).observe(document.querySelector('.fig'));
  }
}());
</script>
</body>
